server:
  port: 8081

spring:
  application:
    name: capacity-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    streams:
      application-id: capacity-service
      state-dir: ${java.io.tmpdir}/capacity-service-streams
      properties:
        commit.interval.ms: 1000
        statestore.cache.max.bytes: 0   # emit every update immediately (demo-friendly)
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

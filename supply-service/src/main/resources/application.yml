server:
  port: 8080

spring:
  application:
    name: supply-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/supply}
    username: ${DB_USER:supply}
    password: ${DB_PASSWORD:supply}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # Flyway owns the schema, not Hibernate
    show-sql: false           # SQL is logged via org.hibernate.SQL below
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
        max.block.ms: 5000
  mvc:
    problemdetails:
      enabled: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE   # uncomment to see bound parameters

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
